name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python tools/check_version.py
      - run: python -m unittest discover -s tests -v
      - run: python demo.py
      - run: python -m pip install .
      - name: Check the installed CLI outside the source tree
        working-directory: ${{ runner.temp }}
        run: muql check "$GITHUB_WORKSPACE/examples/voting.md"
  native-sat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/check_version.py
      - run: python -m pip install '.[sat]'
      - run: python -c "from pysat.solvers import Minisat22; print('MiniSat22 available')"
      - run: python -m unittest discover -s tests -v
      - name: Check the installed native solver outside the source tree
        working-directory: ${{ runner.temp }}
        run: muql search "$GITHUB_WORKSPACE/examples/voting.md" --solver pysat --max-points 2 --max-stages 1
